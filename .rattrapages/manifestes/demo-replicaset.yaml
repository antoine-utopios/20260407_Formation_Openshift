apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: demo-replicaset
  labels:
    app.kubernetes.io/name: demo
spec:
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  template:
    metadata:
      name: demo-pod
      labels:
        app.kubernetes.io/name: demo
    spec:
      containers:
        - name: demo-container
          image: nginx:latest
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 80
